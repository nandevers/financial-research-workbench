[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-research-workbench"
version = "0.1.0"
description = "Source-grounded financial research with a reproducible LangGraph engine and a static evidence explorer."
requires-python = ">=3.11"
dependencies = ["langchain>=1.4,<2", "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "langsmith>=0.14,<1", "pydantic>=2,<3", "requests>=2.32", "beautifulsoup4>=4.12", "lxml>=5", "pypdf>=6", "fonttools>=4.5", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = ["transformers>=4.57", "accelerate>=1", "torch>=2.7", "torchvision>=0.22", "bitsandbytes>=0.48", "huggingface-hub>=0.34", "mistral-common>=1.8.6"]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools.packages.find]
where = ["engine/src"]

[tool.pytest.ini_options]
pythonpath = ["engine/src"]
testpaths = ["engine/tests"]
